scope:
  in_scope:
    - "*.example.com"
  out_of_scope:
    - "admin.example.com"
  max_rps: 10

recon:
  wordlist: "/usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt"
  resolvers:
    - "1.1.1.1"
    - "8.8.8.8"

scan:
  timeout: 10
  user_agent: "bhunter/0.1"
  follow_redirects: false
  headers:
    X-Bug-Bounty: "researcher-handle"

fuzz:
  payload_dir: "rules/"
  concurrency: 5
